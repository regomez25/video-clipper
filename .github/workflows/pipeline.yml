name: Automated Video Clipper

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube Video URL to process"
        required: true
        default: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"

jobs:
  clip-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Standard Node.js setup provides the JS runtime yt-dlp needs
      - name: Setup Node.js (for yt-dlp JS challenge solving)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install System FFmpeg
        run: |
          sudo apt update
          sudo apt install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --force-reinstall "yt-dlp[default]" openai requests

      #- name: Create Cookies File
      # env:
      #   YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
      # run: |
      #   if [ -n "$YOUTUBE_COOKIES" ]; then
      #     echo "$YOUTUBE_COOKIES" > cookies.txt
      #    fi

      - name: Run Auto Clipper
        env:
          TARGET_URL: ${{ github.event.inputs.video_url || 'https://www.youtube.com/watch?v=dQw4w9WgXcQ' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > youtube_cookies.txt
          fi
          python auto_clipper.py

      - name: Upload Output Clips as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rendered-short-clips
          path: ./output/*.mp4
          retention-days: 7
