name: Automated Video Clipper

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube Video URL to process"
        required: true
        default: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"

jobs:
  clip-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # FIX: Install Deno JS runtime for yt-dlp challenge solver
      - name: Set up Deno (JS Runtime for yt-dlp)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Install System FFmpeg
        run: |
          sudo apt update
          sudo apt install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp openai requests

      - name: Create Cookies File
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "$YOUTUBE_COOKIES" > cookies.txt

      - name: Execute Pipeline Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TARGET_URL: ${{ github.event.inputs.youtube_url }}
        run: |
          python auto_clipper.py

      - name: Upload Output Clips as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rendered-short-clips
          path: ./output/*.mp4
          retention-days: 7
